<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your image</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#222;--line:#ddd;--accent:#f26a1b}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--fg:#eee;--line:#444}}
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:720px;margin:0 auto}
  canvas{width:100%;height:auto;display:block;border:1px solid var(--line);touch-action:pan-y;cursor:pointer}
  .row{margin:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .panel{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
  .panel h3{margin:0 0 10px;font-size:16px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer}
  button.alt{background:transparent;color:var(--fg);border:2px solid var(--accent)}
  button.big{flex:1;min-width:130px;padding:16px}
  button:disabled{opacity:.4;cursor:default}
  textarea{width:100%;box-sizing:border-box;min-height:90px;padding:10px;font-size:16px;font-family:'Oswald',sans-serif;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
  input[type=range]{flex:1;min-width:150px}
  .lbl{width:48px;font-size:14px}
  button.sm{padding:9px 12px;font-size:14px}
  .hint{font-size:14px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="panel" id="panel"></div>
  <button id="dl" disabled>Download image</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>

// Finds EVERY blank white rectangle in the template (small white logo shapes are ignored).

  const x = o.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, white = new Uint8Array(w * h), seen = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) white[i] = (d[i*4] > 240 && d[i*4+1] > 240 && d[i*4+2] > 240) ? 1 : 0;
  const found = [];
  for (let s = 0; s < w * h; s++) {
    if (!white[s] || seen[s]) continue;
    const st = [s]; seen[s] = 1;
    let n = 0, x0 = w, y0 = h, x1 = 0, y1 = 0;
    while (st.length) {
      const p = st.pop(), px = p % w, py = (p / w) | 0;
      n++; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      if (px > 0 && white[p-1] && !seen[p-1]) { seen[p-1] = 1; st.push(p-1); }
      if (px < w-1 && white[p+1] && !seen[p+1]) { seen[p+1] = 1; st.push(p+1); }
      if (py > 0 && white[p-w] && !seen[p-w]) { seen[p-w] = 1; st.push(p-w); }
      if (py < h-1 && white[p+w] && !seen[p+w]) { seen[p+w] = 1; st.push(p+w); }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    if (n >= w * h * 0.02 && n / (bw * bh) >= 0.8)
      found.push({ x: x0 / k, y: y0 / k, w: bw / k, h: bh / k, type: null, photo: null, zoom: 1, ox: 0, oy: 0, rot: 0, fine: 0, flip: false, text: '' });
  }
  return found.sort((a, b) => a.y - b.y || a.x - b.x);
}

const filled = s => (s.type === 'photo' && s.photo) || (s.type === 'text' && s.text.trim());
const base = s => { const odd = s.rot % 2 !== 0, ew = odd ? s.photo.height : s.photo.width, eh = odd ? s.photo.width : s.photo.height; return Math.max(s.w / ew, s.h / eh); };
function clamp(s) { s.ox = Math.min(s.w / 2, Math.max(-s.w / 2, s.ox)); s.oy = Math.min(s.h / 2, Math.max(-s.h / 2, s.oy)); }
const resetPhoto = s => Object.assign(s, { zoom: 1, ox: 0, oy: 0, rot: 0, fine: 0, flip: false });
function wrapLines(t, size, maxW) {
  ctx.font = `${WEIGHT} ${size}px '${FONT}', sans-serif`;
  const out = [];
  t.split('\n').forEach(par => {
    let line = '';
    par.split(/\s+/).filter(Boolean).forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width <= maxW || !line) line = test; else { out.push(line); line = w; }
    });
    out.push(line);
  });
  return out;
}
function drawSlot(s, i, ui) {
  ctx.save(); ctx.beginPath(); ctx.rect(s.x, s.y, s.w, s.h); ctx.clip();
  if (s.type === 'photo' && s.photo) {
    clamp(s);
    const sc = base(s) * s.zoom;
    ctx.translate(s.x + s.w / 2 + s.ox, s.y + s.h / 2 + s.oy);
    ctx.scale(s.flip ? -1 : 1, 1);
    ctx.rotate((s.rot * 90 + s.fine) * Math.PI / 180);
    ctx.drawImage(s.photo, -s.photo.width * sc / 2, -s.photo.height * sc / 2, s.photo.width * sc, s.photo.height * sc);
  } else if (s.type === 'text' && s.text.trim()) {
    const pad = s.w * 0.05, maxW = s.w - pad * 2, maxH = s.h - pad * 2;
    let size = s.h * 0.5, lines;
    for (; size > 12; size -= 2) {
      lines = wrapLines(s.text.trim(), size, maxW);
      if (lines.length * size * 1.25 <= maxH && Math.max(...lines.map(l => ctx.measureText(l).width)) <= maxW) break;
    }
    ctx.fillStyle = TEXT_COLOUR; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lh = size * 1.25, top = s.y + s.h / 2 - lines.length * lh / 2 + lh / 2;
    lines.forEach((l, j) => ctx.fillText(l, s.x + s.w / 2, top + j * lh));
  }
  ctx.restore();
  if (!ui) return;
  const u = Math.max(14, cv.width / 40);
  if (!filled(s)) {
    ctx.save(); ctx.setLineDash([u, u * 0.6]); ctx.lineWidth = Math.max(3, u / 4); ctx.strokeStyle = ACCENT;
    ctx.strokeRect(s.x + u / 2, s.y + u / 2, s.w - u, s.h - u); ctx.restore();
    ctx.fillStyle = ACCENT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${u * 4}px system-ui, sans-serif`; ctx.fillText('+', s.x + s.w / 2, s.y + s.h / 2 - u * 1.2);
    ctx.font = `600 ${u * 1.1}px system-ui, sans-serif`; ctx.fillText('Tap to add a photo or text', s.x + s.w / 2, s.y + s.h / 2 + u * 2);
  }
  if (i === sel) { ctx.strokeStyle = ACCENT; ctx.lineWidth = Math.max(4, u / 3); ctx.strokeRect(s.x, s.y, s.w, s.h); }
}
function draw(ui = true) {
  ctx.drawImage(tpl, 0, 0);
  slots.forEach((s, i) => drawSlot(s, i, ui));
  $('dl').disabled = !slots.some(filled);
}

function renderPanel() {
  const p = $('panel'); p.innerHTML = ''; syncTouch();
  const add = (tag, props = {}, html = '') => { const e = Object.assign(document.createElement(tag), props); e.innerHTML = html; return e; };
  if (!slots.length) { p.append(add('div', { className: 'hint' }, 'No blank white box found in this template.')); return; }
  if (sel < 0) { p.append(add('div', { className: 'hint' }, 'Tap a white box on the image to fill it.')); return; }
  const s = slots[sel], label = slots.length > 1 ? `Box ${sel + 1}` : 'Your box';
  p.append(add('h3', {}, label));
  const row = add('div', { className: 'row' });
  if (!s.type) {
    const b1 = add('button', { className: 'big' }, '📷 Photo'), b2 = add('button', { className: 'big alt' }, 'T&nbsp; Text');
    b1.onclick = () => { s.type = 'photo'; $('file').click(); };
    b2.onclick = () => { s.type = 'text'; renderPanel(); draw(); const t = $('txt'); if (t) t.focus(); };
    row.append(b1, b2); p.append(row); return;
  }
  if (s.type === 'photo') {
    const up = add('button', { className: 'alt' }, s.photo ? 'Change photo' : 'Choose photo');
    up.onclick = () => $('file').click();
    row.append(up); p.append(row);
    if (s.photo) {
      const slider = (label, min, max, step, key, extra) => {
        const r = add('div', { className: 'row' }), i = add('input', { type: 'range', min, max, step, value: s[key] });
        i.oninput = () => { s[key] = +i.value; draw(); };
        if (extra) i.id = extra;
        r.append(add('label', { className: 'lbl' }, label), i); return r;
      };
      p.append(slider('Zoom', 0.2, 5, 0.01, 'zoom', 'zs'), slider('Tilt', -45, 45, 1, 'fine'));
      const tools = add('div', { className: 'row' });
      const mk = (txt, fn) => { const b = add('button', { className: 'alt sm' }, txt); b.onclick = () => { fn(); renderPanel(); draw(); }; tools.append(b); };
      mk('⟲ Rotate', () => s.rot = (s.rot + 3) % 4);
      mk('⟳ Rotate', () => s.rot = (s.rot + 1) % 4);
      mk('⇋ Flip', () => s.flip = !s.flip);
      mk('Reset', () => resetPhoto(s));
      p.append(tools, add('div', { className: 'hint' }, 'Drag to move. Pinch or scroll to zoom. The box is your crop frame.'));
    }
  } else {
    const t = add('textarea', { id: 'txt', placeholder: 'Type your text here', maxLength: 300, value: s.text });
    t.oninput = () => { s.text = t.value; draw(); };
    p.append(t);
  }
  const back = add('button', { className: 'alt' }, 'Choose differently / clear');
  back.onclick = () => { Object.assign(s, { type: null, photo: null, text: '' }); resetPhoto(s); renderPanel(); draw(); };
  p.append(add('div', { className: 'row' }), back);
}

$('file').onchange = e => {
  const f = e.target.files[0], s = slots[sel]; e.target.value = '';
  if (!f || !s) { if (s && !s.photo) s.type = null; renderPanel(); draw(); return; }
  const rd = new FileReader();
  rd.onerror = () => alert('Sorry, that photo could not be read. Please try another one.');
  rd.onload = () => {
    const im = new Image();
    im.onload = () => { s.photo = im; resetPhoto(s); renderPanel(); syncTouch(); draw(); };
    im.onerror = () => { alert('That file could not be opened as a photo. Please try a JPG or PNG.'); if (!s.photo) s.type = null; renderPanel(); draw(); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};

// Tap a box to select it. With a photo selected: drag to move, pinch or scroll to zoom.
const pts = new Map(); let pinch = null, last = null;
const pos = e => { const r = cv.getBoundingClientRect(), k = cv.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k }; };
const hit = p => slots.findIndex(s => p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h);
const curPhoto = () => { const s = slots[sel]; return s && s.type === 'photo' && s.photo ? s : null; };
const syncTouch = () => { cv.style.touchAction = curPhoto() ? 'none' : 'pan-y'; };
const setZoom = (s, z) => { s.zoom = Math.min(5, Math.max(0.2, z)); const zs = $('zs'); if (zs) zs.value = s.zoom; draw(); };
cv.onpointerdown = e => {
  const i = hit(pos(e));
  if (i >= 0 && i !== sel) { sel = i; renderPanel(); draw(); }
  syncTouch();
  if (i < 0) return;
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY };
  if (pts.size === 2 && curPhoto()) {
    const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: curPhoto().zoom };
  }
};
cv.onpointermove = e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const s = curPhoto(); if (!s) return;
  if (pts.size === 2 && pinch) {
    const [a, b] = [...pts.values()]; setZoom(s, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
  } else if (pts.size === 1) {
    const k = pos(e).k; s.ox += (e.clientX - last.x) * k; s.oy += (e.clientY - last.y) * k; draw();
  }
  last = { x: e.clientX, y: e.clientY };
};
cv.onpointerup = cv.onpointercancel = e => { pts.delete(e.pointerId); pinch = null; last = pts.size ? [...pts.values()][0] : null; };
cv.addEventListener('wheel', e => {
  const s = curPhoto(); if (!s || hit(pos(e)) !== sel) return;
  e.preventDefault(); setZoom(s, s.zoom * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

$('dl').onclick = () => { draw(false); cv.toBlob(b => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'my-image.png'; a.click(); draw();
}, 'image/png'); };

function loadTemplate(src) {
  const im = new Image();
  im.onload = () => {
    tpl = im; cv.width = im.width; cv.height = im.height;
    slots = detectSlots(im); sel = slots.length === 1 ? 0 : -1;
    renderPanel(); draw();
  };
  im.onerror = () => { if (src !== EMBEDDED) loadTemplate(EMBEDDED); else $('panel').textContent = 'Could not load the template image.'; };
  im.src = src;
}
document.fonts.load(`${WEIGHT} 40px '${FONT}'`).finally(() => loadTemplate(TEMPLATE));
</script>
</body>
</html>
