<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff;--fg:#222;--line:#ddd;--accent:#f26a1b}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1c1c;--fg:#eee;--line:#444}}
  body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
  .wrap{max-width:720px;margin:0 auto}
  canvas#c{width:100%;height:auto;display:block;border:1px solid var(--line);touch-action:pan-y;cursor:pointer}
  .row{margin:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .panel{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
  .panel h3{margin:0 0 10px;font-size:16px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;cursor:pointer}
  button.alt{background:transparent;color:var(--fg);border:2px solid var(--accent)}
  button.big{flex:1;min-width:130px;padding:16px}
  button.sm{padding:9px 12px;font-size:14px}
  button.sm.on{background:var(--accent);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  select{font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1;min-width:200px}
  input[type=range]{flex:1;min-width:150px}
  .lbl{width:48px;font-size:14px}
  .lay{background:transparent;color:var(--fg);border:2px solid var(--line);border-radius:8px;padding:6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:80px}
  .lay canvas{max-width:100%;border-radius:3px}
  .lay.on{border-color:var(--accent)}
  .rte{min-height:90px;padding:10px;font-size:18px;font-family:'Oswald',sans-serif;border:1px solid var(--line);border-radius:6px;background:#fff;color:#0b4ea2;outline:none;box-sizing:border-box;-webkit-user-select:text;user-select:text}
  .rte:empty:before{content:attr(data-ph);opacity:.5}
  .ev{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);margin-top:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  
  .dayrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
  .dayrow b{font-size:14px;display:block;margin-bottom:6px}
  .dayrow button{margin-top:8px}
  #evp label{display:block;font-size:13px;opacity:.9}
  #evp .ev{margin-top:4px}
  .ev.bad{border-color:#c00;outline:2px solid #c00}
  .hint{font-size:14px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div id="pick">
    <div class="row"><select id="format" aria-label="Poster size"></select></div>
    <div class="hint" id="fmtHint"></div>
    <div class="row" id="layouts"></div>
  </div>
  <canvas id="c"></canvas>
  <div class="panel" id="panel"></div>
  <div class="panel" id="evp">
    <h3>When and where</h3>
    <div id="days"></div>
    <div class="row"><button class="alt sm" id="addDay">+ Add another date or range</button></div>
    <label>Venue<input class="ev" type="text" id="evVenue" maxlength="80" placeholder="e.g. Royston Heritage Townhall"></label>
    <div class="hint" id="evMsg" style="color:#c00;margin-top:8px"></div>
  </div>
  <button id="dl" disabled>Download image</button>
  <div class="hint" id="vmsg" style="margin-top:8px"></div>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="file" id="vfile" accept="video/*" hidden>
</div>

  if (s.type === 'photo') {
    const up = add('button', { className: 'alt' }, s.isVideo ? (s.photo ? 'Change video' : 'Choose video') : (s.photo ? 'Change photo' : 'Choose photo'));
    up.onclick = () => $(s.isVideo ? 'vfile' : 'file').click(); row.append(up);
    if (s.isVideo && s.photo) { const v = s.photo, pp = add('button', { className: 'alt', id: 'pp' }, v.paused ? '▶ Play' : '⏸ Pause'); pp.onclick = () => { v.paused ? v.play() : v.pause(); }; row.append(pp); }
    p.append(row);
    if (s.photo) {
      p.append(slider('Zoom', 0.2, 5, 0.01, s.zoom, v => { s.zoom = v; draw(); }, 'zs'), slider('Tilt', -45, 45, 1, s.fine, v => { s.fine = v; draw(); }));
      const tools = add('div', { className: 'row' });
      const mk = (txt, fn) => { const b = add('button', { className: 'alt sm' }, txt); b.onclick = () => { fn(); renderPanel(); draw(); }; tools.append(b); };
      mk('⟲ Rotate', () => s.rot = (s.rot + 3) % 4); mk('⟳ Rotate', () => s.rot = (s.rot + 1) % 4);
      mk('⇋ Flip', () => s.flip = !s.flip); mk('Reset', () => resetPhoto(s));
      p.append(tools, add('div', { className: 'hint' }, 'Drag to move. Pinch or scroll to zoom. The box is your crop frame.'));
    }
  } else {
    savedRange = null;
    const ed = add('div', { id: 'rte', className: 'rte', contentEditable: 'true' }); ed.innerHTML = s.html; ed.dataset.ph = 'Type your text here';
    ed.oninput = () => { s.html = ed.innerHTML; s.plain = ed.innerText; draw(); };
    ed.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain')); };
    ed.ondrop = e => e.preventDefault();
    const tools = add('div', { className: 'row' });
    const fmtBtn = (label, cmd, style) => { const b = add('button', { className: 'alt sm' }, label); b.style.cssText = style; b.onpointerdown = e => e.preventDefault(); b.onclick = () => applyFmt(() => document.execCommand(cmd)); tools.append(b); };
    fmtBtn('B', 'bold', 'font-weight:700;min-width:44px'); fmtBtn('I', 'italic', 'font-style:italic;min-width:44px');
    const aligns = [['left', 'Left'], ['center', 'Centre'], ['right', 'Right']], abtns = [];
    aligns.forEach(([v, l]) => {
      const b = add('button', { className: 'alt sm' + (s.align === v ? ' on' : '') }, l);
      b.onclick = () => { s.align = v; abtns.forEach((x, j) => x.classList.toggle('on', aligns[j][0] === v)); draw(); };
      abtns.push(b); tools.append(b);
    });
    p.append(ed, tools,
      slider('Size', 0.04, 0.4, 0.005, s.tsize, v => { s.tsize = v; draw(); }, '', 84),
      slider('Selected words', 1, 7, 1, 3, v => applyFmt(() => document.execCommand('fontSize', false, v)), '', 84));
    p.append(add('div', { className: 'hint' }, 'Select words, then use B, I or the Selected words slider. Font and colour are fixed.'));
  }
  const back = add('button', { className: 'alt' }, 'Choose differently / clear');
  back.onclick = () => { if (s.isVideo && s.photo) s.photo.pause(); Object.assign(s, { isVideo: false, type: null, photo: null, html: '', plain: '', tsize: 0.14, align: 'center', over: false }); resetPhoto(s); renderPanel(); draw(); };
  p.append(add('div', { className: 'row' }), back);
}

$('file').onchange = e => {
  const f = e.target.files[0], s = slots[sel]; e.target.value = '';
  if (!f || !s) { if (s && !s.photo) s.type = null; renderPanel(); draw(); return; }
  const rd = new FileReader();
  rd.onerror = () => alert('Sorry, that photo could not be read. Please try another one.');
  rd.onload = () => {
    const im = new Image();
    im.onload = () => { s.photo = im; s.isVideo = false; resetPhoto(s); renderPanel(); draw(); };
    im.onerror = () => { alert('That file could not be opened as a photo. Please try a JPG or PNG.'); if (!s.photo) s.type = null; renderPanel(); draw(); };
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
};

// ===== Video =====
$('vfile').onchange = e => {
  const f = e.target.files[0], s = slots[sel]; e.target.value = '';
  const cancel = () => { if (s && !s.photo) { s.type = null; s.isVideo = false; } renderPanel(); draw(); };
  if (!f || !s) { cancel(); return; }
  if (slots.some((o, i) => i !== sel && o.isVideo && o.photo)) { alert('Only one video can be added to a poster.'); cancel(); return; }
  const v = document.createElement('video');
  v.playsInline = true; v.preload = 'auto'; v.setAttribute('playsinline', '');
  Object.defineProperty(v, 'width', { get: () => v.videoWidth }); Object.defineProperty(v, 'height', { get: () => v.videoHeight });
  v.onloadeddata = () => {
    if (s.photo && s.photo !== v) s.photo.pause();
    s.photo = v; s.isVideo = true; resetPhoto(s);
    v.onplay = v.onpause = v.onended = () => { const b = $('pp'); if (b) b.textContent = v.paused ? '▶ Play' : '⏸ Pause'; };
    v.currentTime = 0.05;
  };
  v.onseeked = () => { if (!exporting) { renderPanel(); draw(); } };
  v.onerror = () => { alert('That video could not be opened. Please try an MP4 or MOV from your phone.'); cancel(); };
  v.src = URL.createObjectURL(f);
};
(function tick() { if (!exporting && slots.some(s => s.isVideo && s.photo && !s.photo.paused && !s.photo.ended)) draw(); requestAnimationFrame(tick); })();

const once = (el, name) => new Promise(r => el.addEventListener(name, r, { once: true }));
// Plays the video from the start while recording the finished design, so it takes as long as the video itself.
async function exportVideo() {
  const s = slots.find(x => x.isVideo && x.photo), v = s.photo, msg = $('vmsg');
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  const mime = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime || !HTMLCanvasElement.prototype.captureStream) { alert('Sorry, this browser cannot save videos. Please try the latest Chrome, Edge or Safari.'); return; }
  exporting = true; $('dl').disabled = true;
  try {
    const vk = fmt.video ? fmt.k : Math.max(1, 1080 / Math.min(W, H)), even = n => Math.round(n / 2) * 2;   // video is at least 1080 on its short side
    const out = document.createElement('canvas'); out.width = even(W * vk); out.height = even(H * vk);
    const octx = out.getContext('2d');
    if (!s.ac) { s.ac = new (window.AudioContext || window.webkitAudioContext)(); s.asrc = s.ac.createMediaElementSource(v); s.asrc.connect(s.ac.destination); }
    await s.ac.resume();
    const dest = s.ac.createMediaStreamDestination(); s.asrc.connect(dest);
    const stream = out.captureStream(30); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 }), chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    v.pause(); if (v.currentTime > 0) { v.currentTime = 0; await once(v, 'seeked'); }
    const paint = () => { const main = ctx; ctx = octx; ctx.save(); ctx.scale(out.width / W, out.height / H); try { drawAll(false); } finally { ctx.restore(); ctx = main; } };
    paint(); rec.start(1000); await v.play();
    await new Promise(res => {
      const step = () => { paint(); msg.textContent = `Creating your video… ${Math.round(100 * v.currentTime / (v.duration || 1))}%. Please keep this page open.`; if (v.ended) res(); else requestAnimationFrame(step); };
      step();
    });
    paint(); rec.stop(); await stopped; s.asrc.disconnect(dest);
    const mp4 = mime.includes('mp4'), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: mime.split(';')[0] })); a.download = 'instagram-video.' + (mp4 ? 'mp4' : 'webm'); a.click();
    msg.textContent = mp4 ? 'Done! Your video has been downloaded.' : 'Done! Your video was saved as WebM. If Instagram will not accept it, convert it to MP4 first (for example at cloudconvert.com).';
  } catch (err) { msg.textContent = 'Sorry, the video could not be created. Please try again.'; }
  finally { exporting = false; v.pause(); v.currentTime = 0; draw(); }
}

// ===== Pointer: tap to select, drag to move, pinch / scroll to zoom =====
const pts = new Map(); let pinch = null, last = null;
const pos = e => { const r = cv.getBoundingClientRect(), k = cv.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, k }; };
const hit = p => slots.findIndex(s => p.x >= s.x && p.x <= s.x + s.w && p.y >= s.y && p.y <= s.y + s.h);
const setZoom = (s, z) => { s.zoom = Math.min(5, Math.max(0.2, z)); const zs = $('zs'); if (zs) zs.value = s.zoom; draw(); };
cv.onpointerdown = e => {
  const i = hit(pos(e));
  if (i >= 0 && i !== sel) { sel = i; renderPanel(); draw(); }
  syncTouch();
  if (i < 0) return;
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = { x: e.clientX, y: e.clientY };
  if (pts.size === 2 && curPhoto()) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: curPhoto().zoom }; }
};
cv.onpointermove = e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const s = curPhoto(); if (!s) return;
  if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; setZoom(s, pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); }
  else if (pts.size === 1) { const k = pos(e).k; s.ox += (e.clientX - last.x) * k; s.oy += (e.clientY - last.y) * k; draw(); }
  last = { x: e.clientX, y: e.clientY };
};
cv.onpointerup = cv.onpointercancel = e => { pts.delete(e.pointerId); pinch = null; last = pts.size ? [...pts.values()][0] : null; };
cv.addEventListener('wheel', e => {
  const s = curPhoto(); if (!s || hit(pos(e)) !== sel) return;
  e.preventDefault(); setZoom(s, s.zoom * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

// ===== Download (re-drawn at full print size) =====
$('dl').onclick = () => {
  if (!tpl) {
    const bad = ev.days.findIndex(d => !d.date);
    if (bad >= 0) {
      const inp = $('days').children[bad].querySelector('input[type=date]');
      inp.classList.add('bad'); $('evMsg').textContent = 'Please choose a date for each entry, so the year is on your poster.';
      inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); return;
    }
    const wrong = ev.days.findIndex(d => d.end && d.end < d.date);
    if (wrong >= 0) {
      const inp = $('days').children[wrong].querySelectorAll('input')[1];
      inp.classList.add('bad'); $('evMsg').textContent = 'The end date must not be before the start date.';
      inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); return;
    }
  }
  if (hasVideo()) { exportVideo(); return; }
  const k = tpl ? 1 : fmt.k, out = document.createElement('canvas');
  out.width = Math.round(W * k); out.height = Math.round(H * k);
  const main = ctx; ctx = out.getContext('2d'); ctx.scale(k, k);
  try { drawAll(false); } finally { ctx = main; }
  out.toBlob(b => {
    if (!b) { alert('Sorry, the image could not be created. Please try again.'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = (tpl ? 'my-image' : 'poster-' + fmt.id) + '.png'; a.click();
  }, 'image/png');
};

// ===== Size and layout pickers =====
const anyFilled = () => slots.some(filled);
const okToClear = () => !anyFilled() || confirm('Changing the layout will clear what you have added. Continue?');
function hint() {
  const px = `${Math.round(W * fmt.k)} × ${Math.round(H * fmt.k)} px`;
  $('fmtHint').textContent = 'Downloads as ' + px + (fmt.dpi ? ` (${fmt.dpi} dpi at this paper size)` : '') + (tpl ? '' : '. If you add a video, you get a video file instead.');
}
function rebuild() {
  const g = GROUPS[fmt.g]; W = g.W; H = g.H; cv.width = W; cv.height = H;
  slots = computeRects(W, H, g.layouts[layoutIdx]).map(newSlot);
  sel = slots.length === 1 ? 0 : -1; hint(); renderPanel(); draw();
}
function buildPicker() {
  const g = GROUPS[fmt.g], box = $('layouts'); box.innerHTML = '';
  g.layouts.forEach((l, i) => {
    const b = document.createElement('button'), c = document.createElement('canvas'), sc = 90 / Math.max(g.W, g.H);
    b.className = 'lay' + (i === layoutIdx ? ' on' : ''); c.width = Math.round(g.W * sc); c.height = Math.round(g.H * sc);
    const t = c.getContext('2d'); t.scale(sc, sc); drawTemplate(t, g.W, g.H, computeRects(g.W, g.H, l));
    b.append(c, Object.assign(document.createElement('span'), { textContent: l.name }));
    b.onclick = () => { if (i === layoutIdx || !okToClear()) return; layoutIdx = i; [...box.children].forEach((x, j) => x.classList.toggle('on', j === i)); rebuild(); };
    box.append(b);
  });
}
$('format').onchange = e => {
  const nf = FORMATS.find(f => f.id === e.target.value);
  if (nf.g === fmt.g) { fmt = nf; hint(); return; }       // same shape: keep your work, only the download size changes
  if (!okToClear()) { e.target.value = fmt.id; return; }
  fmt = nf; layoutIdx = 0; buildPicker(); rebuild();
};

function renderDays() {
  const box = $('days'); box.innerHTML = '';
  ev.days.forEach((d, i) => {
    const row = document.createElement('div'); row.className = 'dayrow';
    row.innerHTML = `<b>Date ${i + 1}</b><div class="grid3"><label>Date${i === 0 ? ' (required)' : ''}<input class="ev" type="date" min="2020-01-01" max="2100-12-31"></label><label>End date (only for a range)<input class="ev" type="date" max="2100-12-31"></label><label>Start time<input class="ev" type="time"></label><label>End time<input class="ev" type="time"></label></div><div class="hint">A range shares the same times, e.g. Saturday to Sunday.</div>`;
    const [dt, en, fr, to] = row.querySelectorAll('input'); dt.value = d.date; en.value = d.end; fr.value = d.from; to.value = d.to; en.min = d.date || '2020-01-01';
    dt.oninput = () => { d.date = dt.value; en.min = d.date || '2020-01-01'; dt.classList.remove('bad'); $('evMsg').textContent = ''; draw(); };
    en.oninput = () => { d.end = en.value; en.classList.remove('bad'); $('evMsg').textContent = ''; draw(); };
    fr.oninput = () => { d.from = fr.value; draw(); };
    to.oninput = () => { d.to = to.value; draw(); };
    if (ev.days.length > 1) { const rm = document.createElement('button'); rm.className = 'alt sm'; rm.textContent = 'Remove this date'; rm.onclick = () => { ev.days.splice(i, 1); renderDays(); draw(); }; row.append(rm); }
    box.append(row);
  });
  $('addDay').hidden = ev.days.length >= 3;
}
$('addDay').onclick = () => {
  const last = ev.days[ev.days.length - 1], prev = last.end > last.date ? last.end : last.date; let next = '';
  if (prev) { const n = new Date(prev + 'T12:00:00'); n.setDate(n.getDate() + 1); next = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; }
  ev.days.push({ date: next, end: '', from: '', to: '' }); renderDays(); draw();
};
$('evVenue').oninput = e => { ev.venue = e.target.value; draw(); };

// ===== Start =====
(async function () {
  try { await Promise.all([document.fonts.load(`500 40px '${FONT}'`), document.fonts.load(`700 40px '${FONT}'`)]); } catch (e) {}
  if (CUSTOM) {
    $('pick').hidden = true; $('evp').hidden = true;
    try { tpl = await load(CUSTOM); } catch (e) { $('panel').textContent = 'Could not load the template image.'; return; }
    W = tpl.width; H = tpl.height; cv.width = W; cv.height = H; slots = detectSlots(tpl); sel = slots.length === 1 ? 0 : -1; renderPanel(); draw(); return;
  }
  renderDays();
  LG.herts = await load(LOGO_SRC.herts); LG.bmf = await load(LOGO_SRC.bmf); gradCv = makeGrad();
  FORMATS.forEach(f => $('format').append(Object.assign(document.createElement('option'), { value: f.id, textContent: f.name })));
  buildPicker(); rebuild();
})();
</script>
